[project]
name = "lucent"
version = "0.1.0"
description = "Deterministic Discord operations and workflow automation"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "async-lru",
    "asyncpg",
    "chat-exporter",
    "discord-py",
    "emojis",
    "humanfriendly",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F821", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
